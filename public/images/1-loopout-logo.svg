<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font: bold 24px sans-serif; fill: #0066CC; }
    .dot { fill: #0066CC; }
    .loop { fill: none; stroke: #0066CC; stroke-width: 3; }
  </style>
  
  <!-- Text -->
  <text x="60" y="32" class="text">loopout</text>
  
