<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f9fafb" />
  
  <!-- Road -->
  <rect x="0" y="400" width="800" height="100" fill="#374151" />
  <rect x="0" y="400" width="800" height="10" fill="#4B5563" />
  
  <!-- Road markings -->
  <rect x="50" y="445" width="80" height="10" fill="#f9fafb" />
  <rect x="200" y="445" width="80" height="10" fill="#f9fafb" />
  <rect x="350" y="445" width="80" height="10" fill="#f9fafb" />
  <rect x="500" y="445" width="80" height="10" fill="#f9fafb" />
  <rect x="650" y="445" width="80" height="10" fill="#f9fafb" />
  
  <!-- Hills in background -->
  <path d="M0,350 Q200,250 400,330 Q600,250 800,320 L800,400 L0,400 Z" fill="#d1fae5" />
  
  <!-- Fields in middle distance -->
  <path d="M0,380 Q100,360 200,375 Q300,360 400,380 Q500,365 600,375 Q700,360 800,380 L800,400 L0,400 Z" fill="#10b981" />
  
  <!-- Purple Delivery Truck -->
  <g transform="translate(500, 380) scale(0.8)">
    <!-- Truck Body -->
    <rect x="30" y="-80" width="200" height="80" rx="10" fill="#8000ff" />
    
    <!-- Truck Cabin -->
    <rect x="-50" y="-80" width="80" height="80" rx="10" fill="#8000ff" />
    
    <!-- Windows -->
    <rect x="-35" y="-65" width="55" height="35" rx="5" fill="#dbeafe" />
    
    <!-- Tires -->
    <circle cx="-10" cy="20" r="20" fill="#1f2937" />
    <circle cx="-10" cy="20" r="10" fill="#9ca3af" />
    <circle cx="180" cy="20" r="20" fill="#1f2937" />
    <circle cx="180" cy="20" r="10" fill="#9ca3af" />
    <circle cx="70" cy="20" r="20" fill="#1f2937" />
    <circle cx="70" cy="20" r="10" fill="#9ca3af" />
    
    <!-- Cargo Door -->
    <rect x="150" y="-60" width="60" height="50" fill="#6b21a8" />
    
    <!-- TruckConnect Logo -->
    <text x="50" y="-30" font-family="Arial" font-size="16" fill="white" font-weight="bold">TruckConnect</text>
  </g>
  
  <!-- Green Farm Truck -->
  <g transform="translate(150, 390) scale(0.6)">
    <!-- Truck Body -->
    <rect x="30" y="-80" width="200" height="70" rx="5" fill="#15803d" />
    
    <!-- Truck Cabin -->
    <rect x="-50" y="-80" width="80" height="70" rx="10" fill="#15803d" />
    
    <!-- Windows -->
    <rect x="-35" y="-65" width="55" height="35" rx="5" fill="#dbeafe" />
    
    <!-- Tires -->
    <circle cx="-10" cy="10" r="20" fill="#1f2937" />
    <circle cx="-10" cy="10" r="10" fill="#9ca3af" />
    <circle cx="180" cy="10" r="20" fill="#1f2937" />
    <circle cx="180" cy="10" r="10" fill="#9ca3af" />
    <circle cx="70" cy="10" r="20" fill="#1f2937" />
    <circle cx="70" cy="10" r="10" fill="#9ca3af" />
    
    <!-- Cargo -->
    <rect x="90" y="-110" width="100" height="30" fill="#fef3c7" />
  </g>
  
  <!-- Farm buildings in distance -->
  <g transform="translate(650, 340) scale(0.5)">
    <!-- Barn -->
    <rect x="0" y="0" width="120" height="80" fill="#b91c1c" />
    <polygon points="0,0 60,−40 120,0" fill="#ef4444" />
    
    <!-- Farmhouse -->
    <rect x="-150" y="20" width="100" height="60" fill="#f9fafb" />
    <polygon points="-150,20 -100,-20 -50,20" fill="#9ca3af" />
  </g>
  
  <!-- Sun -->
  <circle cx="700" cy="100" r="50" fill="#fcd34d" />
  <circle cx="700" cy="100" r="40" fill="#fef3c7" />
  
  <!-- Clouds -->
  <g fill="#f9fafb" opacity="0.8">
    <ellipse cx="200" cy="150" rx="60" ry="30" />
    <ellipse cx="250" cy="140" rx="70" ry="40" />
    <ellipse cx="180" cy="130" rx="50" ry="30" />
    
    <ellipse cx="500" cy="100" rx="70" ry="40" />
    <ellipse cx="550" cy="90" rx="80" ry="35" />
    <ellipse cx="480" cy="80" rx="60" ry="30" />
  </g>
</svg>